# golangci-lint configuration for worklog.
run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gofmt

issues:
  exclude-rules:
    # Test files may ignore errors for brevity.
    - path: _test\.go
      linters:
        - errcheck
